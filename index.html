<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121216" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net https://storage.googleapis.com blob:; worker-src 'self' blob: https://cdn.jsdelivr.net; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Hand Cube</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="view">
      <video id="camera" playsinline webkit-playsinline muted disablepictureinpicture></video>
      <canvas id="stage"></canvas>
      <div id="hud">
        <p id="state">Waiting for camera</p>
        <p id="hint">Tap to start the camera</p>
      </div>
      <button id="start" type="button">Start camera</button>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
